# Configuração do Banco de Dados PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tenisbasquete_db

# CONFIGURAÇÃO PARA RESETAR O BANCO - RECRIA TODAS AS TABELAS
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# Configurações para upload de arquivos
quarkus.http.body.uploads-directory=uploads
quarkus.http.body.delete-uploaded-files-on-end=false
quarkus.http.body.preallocate-body-buffer=true

# Tamanho máximo do upload (20MB)
quarkus.http.limits.max-body-size=20M
quarkus.http.limits.max-form-attribute-size=20M

# Configuração Multipart para upload de arquivos
quarkus.resteasy.multipart.input-part.default-charset=UTF-8
quarkus.resteasy.multipart.input-part.default-content-type=application/octet-stream

# Configuração da porta
quarkus.http.port=8080

# CORS configuration
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Configuração do MinIO (ajuste conforme seu ambiente)
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket.name=tenis-bucket
minio.region=us-east-1

# Logging para desenvolvimento
quarkus.log.category."org.acme".level=DEBUG
quarkus.log.category."org.hibernate".level=INFO
quarkus.log.category."io.minio".level=DEBUG

# Configurações de JSON
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.fail-on-empty-beans=false

# Configuração de health checks
quarkus.smallrye-health.enabled=true